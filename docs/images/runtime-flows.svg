<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-label="Every flow runs on the JavaFX thread, and teardown runs on hiding before Glass frees the window">
  <title>Teardown runs on hiding, before Glass frees the window</title>
  <style>
    svg { --ink: #1f1e1c; --quiet: #6b6963; --edge: #b9b6ac; --grid: #e4e2dc; --accent: #2f7de1; font-family: "Anthropic Sans", "Anthropic Sans Roman Fallback", ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink { fill: var(--ink); }
    .quiet { fill: var(--quiet); }
    .title { font-size: 15px; font-weight: 600; }
    .name { font-size: 13px; font-weight: 600; }
    .line { font-size: 11.5px; }
    .head { fill: none; stroke: var(--edge); stroke-width: 1.25; }
    .life { stroke: var(--edge); stroke-width: 1; stroke-dasharray: 3 4; }
    .rule { stroke: var(--grid); stroke-width: 1; }
    .msg { fill: none; stroke: var(--edge); stroke-width: 1.25; }
    .ret { stroke-dasharray: 5 4; }
    .msg-accent { fill: none; stroke: var(--accent); stroke-width: 2; }
    .arrowhead { fill: var(--edge); }
    .arrowhead-accent { fill: var(--accent); }
  </style>
  <defs>
    <marker id="seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrowhead" d="M0 0L10 5L0 10z"/>
    </marker>
    <marker id="seq-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrowhead-accent" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text class="ink title" x="24" y="28">Teardown runs on hiding, before Glass frees the window</text>

  <!-- Phase separators -->
  <line class="rule" x1="24" x2="736" y1="96" y2="96"/>
  <line class="rule" x1="24" x2="736" y1="272" y2="272"/>
  <line class="rule" x1="24" x2="736" y1="384" y2="384"/>
  <line class="rule" x1="24" x2="736" y1="464" y2="464"/>

  <!-- Lifelines -->
  <rect class="head" x="135" y="48" width="130" height="32" rx="8"/>
  <line class="life" x1="200" x2="200" y1="80" y2="576"/>
  <text class="ink name" x="200" y="68" text-anchor="middle">JavaFX thread</text>

  <rect class="head" x="290" y="48" width="130" height="32" rx="8"/>
  <line class="life" x1="355" x2="355" y1="80" y2="576"/>
  <text class="ink name" x="355" y="68" text-anchor="middle">MetalRenderer</text>

  <rect class="head" x="445" y="48" width="130" height="32" rx="8"/>
  <line class="life" x1="510" x2="510" y1="80" y2="576"/>
  <text class="ink name" x="510" y="68" text-anchor="middle">Swift dylib</text>

  <rect class="head" x="600" y="48" width="130" height="32" rx="8"/>
  <line class="life" x1="665" x2="665" y1="80" y2="576"/>
  <text class="ink name" x="665" y="68" text-anchor="middle">AppKit / Metal</text>

  <!-- Startup -->
  <text class="ink name" x="24" y="128">Startup</text>
  <text class="quiet line" x="24" y="144">init, runLater</text>
  <path class="msg" d="M200 124H355" marker-end="url(#seq-arrow)"/>
  <text class="quiet line" x="277.5" y="118" text-anchor="middle">load dylib, bind</text>
  <path class="msg" d="M200 156H355" marker-end="url(#seq-arrow)"/>
  <text class="quiet line" x="277.5" y="150" text-anchor="middle">attach(handle)</text>
  <path class="msg" d="M355 188H510" marker-end="url(#seq-arrow)"/>
  <text class="quiet line" x="432.5" y="182" text-anchor="middle">init_metal_renderer</text>
  <path class="msg" d="M510 220H665" marker-end="url(#seq-arrow)"/>
  <text class="quiet line" x="587.5" y="214" text-anchor="middle">child window + layer</text>
  <path class="msg ret" d="M510 252H355" marker-end="url(#seq-arrow)"/>
  <text class="quiet line" x="432.5" y="246" text-anchor="middle">ctx pointer (+1)</text>

  <!-- Every pulse -->
  <text class="ink name" x="24" y="304">Every pulse</text>
  <text class="quiet line" x="24" y="320">AnimationTimer</text>
  <path class="msg" d="M200 300H355" marker-end="url(#seq-arrow)"/>
  <text class="quiet line" x="277.5" y="294" text-anchor="middle">bounds, renderFrame</text>
  <path class="msg" d="M355 332H510" marker-end="url(#seq-arrow)"/>
  <text class="quiet line" x="432.5" y="326" text-anchor="middle">bounds, render_frame</text>
  <path class="msg" d="M510 364H665" marker-end="url(#seq-arrow)"/>
  <text class="quiet line" x="587.5" y="358" text-anchor="middle">setFrame, present</text>

  <!-- User input -->
  <text class="ink name" x="24" y="416">User input</text>
  <text class="quiet line" x="24" y="432">controls, drag</text>
  <path class="msg" d="M200 412H355" marker-end="url(#seq-arrow)"/>
  <text class="quiet line" x="277.5" y="406" text-anchor="middle">alpha, mode, rotate</text>
  <path class="msg" d="M355 444H510" marker-end="url(#seq-arrow)"/>
  <text class="quiet line" x="432.5" y="438" text-anchor="middle">set_*, update_rotation</text>

  <!-- Teardown (accent) -->
  <text class="ink name" x="24" y="496">Teardown</text>
  <text class="quiet line" x="24" y="512">stage hiding</text>
  <path class="msg-accent" d="M200 492H355" marker-end="url(#seq-arrow-acc)"/>
  <text class="ink line" x="277.5" y="486" text-anchor="middle">stop timer, close()</text>
  <path class="msg-accent" d="M355 524H510" marker-end="url(#seq-arrow-acc)"/>
  <text class="ink line" x="432.5" y="518" text-anchor="middle">destroy_metal_renderer</text>
  <path class="msg-accent" d="M510 556H665" marker-end="url(#seq-arrow-acc)"/>
  <text class="ink line" x="587.5" y="550" text-anchor="middle">remove child window</text>
</svg>
